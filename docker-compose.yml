version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engineering-assessment-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - /app/node_modules
    restart: unless-stopped
    networks:
      - assessment-network

networks:
  assessment-network:
    driver: bridge
